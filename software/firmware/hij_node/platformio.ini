; Firmware del nodo para la extensión HIJ 2026 (Heltec WiFi LoRa 32 V3 + BNO085)
;   pio run -t upload                      compila y carga (COM5)
;   pio device monitor                     consola serie a 115200 baudios
;   python tools/serial_logger.py <id>     registra la verdad terreno en software/data/raw/<id>/

[platformio]
; Sin -e, pio compila y carga solo el nodo principal (lo usan campaign.py, run.py y field.py recarga)
default_envs = heltec_v3

[env:heltec_v3]
; Core Arduino 3.x (ESP-IDF 5)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = heltec_wifi_lora_32_V3
framework = arduino
; Dos ranuras de aplicación (OTA) y una partición LittleFS donde se guarda el buffer de bins
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7
    adafruit/Adafruit BNO08x@^1.2
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6

; Segundo nodo (dispositivo lorapasos-2 en TTN): mismas opciones, claves de include/secrets_nodo2.h
;   pio run -e nodo2 -t upload --upload-port COMx
[env:nodo2]
extends = env:heltec_v3
build_flags = -DNODE_ID=2

; Tercer nodo (dispositivo lorapasos-3 en TTN), claves de include/secrets_nodo3.h
;   pio run -e nodo3 -t upload --upload-port COMx
[env:nodo3]
extends = env:heltec_v3
build_flags = -DNODE_ID=3
